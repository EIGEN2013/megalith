<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Top-down map</title>
<style>html, body { margin: 0; background: #333; } canvas { width: 100%; height: auto; display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ?m=a.glb,b.glb&cx=0&cz=0&span=80&size=900&grid=10&yaw=&pitch=  (pitch 90 = straight down)
const q = new URLSearchParams(location.search);
const cx = +(q.get('cx') || 0), cz = +(q.get('cz') || 0), span = +(q.get('span') || 80), size = +(q.get('size') || 900);
const pitch = +(q.get('pitch') || 90) * Math.PI / 180, yaw = +(q.get('yaw') || 0) * Math.PI / 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(size, size, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
if (q.get('clip')) renderer.clippingPlanes = [new THREE.Plane(new THREE.Vector3(0, -1, 0), +q.get('clip'))];   // cut away roofs and ceilings
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x223344);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(30, 80, 20); scene.add(sun);
const loader = new GLTFLoader();
for (const m of q.get('m').split(',')) {
  const g = await loader.loadAsync(m);
  g.scene.traverse(o => { if (o.isMesh) { o.material.side = THREE.DoubleSide; if (/^proto_/.test(o.name)) o.visible = false; } });
  scene.add(g.scene);
}
const grid = +(q.get('grid') || 0);
if (grid) {
  const mat = new THREE.LineBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5, depthTest: false });
  const pts = [];
  for (let v = Math.ceil((cx - span) / grid) * grid; v <= cx + span; v += grid) pts.push(v, 60, cz - span, v, 60, cz + span);
  for (let v = Math.ceil((cz - span) / grid) * grid; v <= cz + span; v += grid) pts.push(cx - span, 60, v, cx + span, 60, v);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(geo, mat); lines.renderOrder = 10; scene.add(lines);
}
const cam = new THREE.OrthographicCamera(-span, span, span, -span, 0.1, 2000);
const d = 500;
const cy = +(q.get('cy') || 0);
cam.position.set(cx + Math.sin(yaw) * Math.cos(pitch) * d, cy + Math.sin(pitch) * d, cz + Math.cos(yaw) * Math.cos(pitch) * d);
cam.up.set(0, 0, -1);
if (pitch < 1.5) cam.up.set(0, 1, 0);
cam.lookAt(cx, cy, cz);
renderer.render(scene, cam);
</script>
</body>
</html>
