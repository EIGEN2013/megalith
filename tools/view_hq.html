<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HQ viewer</title>
<style>html, body { margin: 0; background: #333; } canvas { width: 100%; height: auto; display: block; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ?m=a.glb&views=yaw:pitch:dist:tx:ty:tz;...&w=900&h=700&fov=35  (one image per view, side by side)
const q = new URLSearchParams(location.search);
const views = (q.get('views') || '25:12:5:0:1.3:0').split(';').map(s => s.split(':').map(Number));
const w = +(q.get('w') || 600), h = +(q.get('h') || 700);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(w * views.length, h, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +(q.get('exp') || 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(q.get('bg') || '#7f8c99');
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = +(q.get('env') || 0.35);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x5a5040, 0.8));
const sun = new THREE.DirectionalLight(0xfff1dd, 3.0);
sun.position.set(4, 7, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 30 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({ color: 0x6d6a5f, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const loader = new GLTFLoader();
for (const m of q.get('m').split(',')) {
  const g = await loader.loadAsync(m + '?t=' + Date.now());
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; if (o.material.emissiveMap) o.material.emissiveIntensity = +(q.get('glow') || 1.5); } });
  if (q.get('only')) { const keep = q.get('only').split(','); g.scene.children.slice().forEach(c => { if (!keep.includes(c.name)) g.scene.remove(c); }); }
  if (q.get('row')) { const sp = +q.get('row'); const kids = g.scene.children; kids.forEach((c, i) => { c.position.x += (i - (kids.length - 1) / 2) * sp; }); }
  scene.add(g.scene);
}
if (q.get('shadow')) { const s = +q.get('shadow'); Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, far: 200 }); sun.position.multiplyScalar(s / 4); sun.shadow.camera.updateProjectionMatrix(); }
if (q.get('ground')) ground.material.color.set(q.get('ground'));
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 35), w / h, 0.05, 200);
views.forEach(([yaw, pitch, dist, tx, ty, tz], i) => {
  const a = yaw * Math.PI / 180, p = pitch * Math.PI / 180;
  cam.position.set(tx + Math.sin(a) * Math.cos(p) * dist, ty + Math.sin(p) * dist, tz + Math.cos(a) * Math.cos(p) * dist);
  cam.lookAt(tx, ty, tz);
  renderer.setViewport(i * w, 0, w, h); renderer.setScissor(i * w, 0, w, h);
  renderer.render(scene, cam);
});
document.title = 'done';
</script>
</body>
</html>
