<title>메갈리스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* Layout: one screen. The 3D world fills it; the title and current goal sit top-left, the key
     legend bottom-left, the dialogue box bottom-centre. Single committed look: moss-dark glass
     panels with parchment text, rune cyan for the stones' voice, ember orange for memories. */
  :root {
    color-scheme: dark;
    --mist: #c4d6dc;
    --night: #0b0e0c;
    --ink: #f3efe4;
    --ink-dim: #c5c1b2;
    --panel: rgba(22, 27, 22, 0.78);
    --panel-line: rgba(243, 239, 228, 0.18);
    --rune: #8fe6f7;
    --ember: #f3a95f;
    --moss: #6f9a57;
    --moss-deep: #2f4a2a;
    --font-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
    --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage { position: relative; height: 100%; min-height: 320px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--mist); }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #view:focus-visible { box-shadow: inset 0 0 0 2px var(--moss); }
  #veil { position: absolute; inset: 0; background: var(--night); opacity: 1; pointer-events: none; transition: opacity 2.8s ease-out; }
  #veil.open { opacity: 0; }
  #flash { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f4fbff 45%, #dff3fb 100%);
    opacity: 0; pointer-events: none; color: #5d7480; font-family: var(--font-display); font-size: 28px; letter-spacing: 0.3em; }
  #flash.on { opacity: 1; }
  #flash p { margin: 0; }

  .overlay {
    position: absolute; left: 0; right: 0; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap;
  }
  .overlay.top { top: 0; padding-block: 14px 0; align-items: flex-start; }
  .overlay.bottom { bottom: 0; padding-block: 0 14px; align-items: flex-end; }
  .panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 3px; }

  .nameplate { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 11px; min-width: 0; max-width: min(100%, 420px); }
  .nameplate h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: 0.14em; }
  #objective { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.45; display: flex; gap: 8px; align-items: baseline; }
  #objective::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); transform: translateY(-1px); box-shadow: 0 0 0 3px rgba(243, 169, 95, 0.22); }

  .legend { padding: 10px 12px; display: grid; grid-template-columns: auto auto; gap: 5px 14px; align-items: center; font-size: 13px; margin: 0; max-width: 100%; }
  .legend dt { display: flex; gap: 4px; flex-wrap: wrap; }
  .legend dd { margin: 0; color: var(--ink-dim); }
  kbd {
    font-family: var(--font-ui); font-size: 12px; font-weight: 600; line-height: 1;
    padding: 4px 6px; border-radius: 3px; background: rgba(243, 239, 228, 0.1);
    border: 1px solid var(--panel-line); border-bottom-width: 2px; color: var(--ink);
  }

  /* Dialogue */
  .talk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 18px; pointer-events: none; }
  #prompt { padding: 7px 12px; display: flex; gap: 8px; align-items: center; font-weight: 500; pointer-events: auto; cursor: pointer; }
  #prompt b { color: var(--ember); font-weight: 600; }
  #dialogue { width: min(100%, 720px); padding: 14px 18px 12px; pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  #dialogue:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  #dlg-who { font-weight: 600; font-size: 13px; letter-spacing: 0.06em; color: var(--moss); min-height: 0; }
  #dialogue[data-who="voice"] #dlg-who { color: var(--rune); }
  #dialogue[data-who="voice"] #dlg-text { color: var(--rune); }
  #dialogue[data-who="narration"] #dlg-who { display: none; }
  #dialogue[data-who="narration"] #dlg-text { color: var(--ink-dim); }
  #dlg-text { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.6; min-height: 3.2em; text-wrap: pretty; overflow-wrap: anywhere; }
  #dlg-next { align-self: flex-end; font-size: 12px; color: var(--ink-dim); opacity: 0; transition: opacity 0.2s; }
  #dialogue.ready #dlg-next { opacity: 1; }
  #stage.talking .legend, #stage.talking .touch, #stage.talking #prompt { display: none; }

  /* Touch controls: hidden until a touch is seen (or on coarse pointers). */
  .touch { display: none; pointer-events: auto; }
  body.touching .touch { display: flex; }
  body.touching .legend { display: none; }
  #stick { width: 112px; height: 112px; border-radius: 50%; position: relative; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--moss); border: 1px solid rgba(0, 0, 0, 0.35); pointer-events: none; }
  .pads { gap: 10px; align-items: flex-end; }
  .pads button { font: 600 14px var(--font-ui); color: var(--ink); touch-action: none; width: 66px; height: 66px; border-radius: 50%; background: var(--panel); border: 1px solid var(--panel-line); }
  .pads button.on, .pads button:active { background: var(--moss-deep); border-color: var(--moss); }
  .pads button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

  #dialogue[data-who^="npc_"] #dlg-who { color: var(--ember); }

  /* Developer start menu: pick where the game begins */
  #devstart { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(11, 14, 12, 0.72);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #devstart .card { width: min(100%, 440px); padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 10px; }
  #devstart h2 { margin: 0; font-family: var(--font-display); font-size: 24px; letter-spacing: 0.14em; }
  #devstart .tag { align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: var(--ember);
    border: 1px solid rgba(243, 169, 95, 0.45); border-radius: 3px; padding: 2px 6px; }
  #devstart p { margin: 0 0 4px; color: var(--ink-dim); font-size: 13px; line-height: 1.5; }
  #devstart button { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; cursor: pointer;
    font: 500 15px var(--font-ui); color: var(--ink); background: rgba(243, 239, 228, 0.06); border: 1px solid var(--panel-line);
    border-radius: 3px; padding: 10px 12px; }
  #devstart button:hover { background: rgba(111, 154, 87, 0.22); border-color: var(--moss); }
  #devstart button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  #devstart button kbd { justify-self: start; }
  #devstart button small { display: block; color: var(--ink-dim); font-size: 12px; font-weight: 400; margin-top: 2px; }
  #devstart .wait { color: var(--ink-dim); font-size: 12px; }

  #curtain { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: var(--night); color: var(--ink-dim);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--font-display); font-size: 17px; }
  #curtain p { margin: 0; max-width: 34ch; text-wrap: balance; }
  @media (max-width: 560px) { #dlg-text { font-size: 16px; } .nameplate h1 { font-size: 19px; } }
</style>

<div id="stage">
  <canvas id="view" tabindex="0" aria-label="메갈리스의 스톤헨지와 숲. 키보드로 로빈을 조작합니다."></canvas>
  <div id="veil"></div>
  <div id="flash" aria-hidden="true"><p id="flash-text"></p></div>

  <div class="overlay top">
    <div class="nameplate panel" id="nameplate" hidden>
      <h1>메갈리스</h1>
      <p id="objective"></p>
    </div>
  </div>

  <div class="overlay bottom">
    <dl class="legend panel" id="legend" aria-label="조작법" hidden>
      <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>달리기</dd>
      <dt><kbd>Space</kbd></dt><dd>점프, 공중에서 한 번 더 누르면 2단 점프</dd>
      <dt><kbd>J</kbd> <kbd>클릭</kbd></dt><dd>공격</dd>
      <dt><kbd>F</kbd></dt><dd>가까운 돌 살펴보기</dd>
      <dt><kbd>Q</kbd><kbd>E</kbd> <kbd>드래그</kbd></dt><dd>카메라 회전, 휠로 확대</dd>
    </dl>
    <div class="touch panel" id="stick" aria-label="이동 스틱"><div id="knob"></div></div>
    <div class="touch pads">
      <button type="button" id="btn-attack">공격</button>
      <button type="button" id="btn-jump">점프</button>
    </div>
  </div>

  <div class="talk">
    <div class="panel" id="prompt" role="button" tabindex="0" hidden><kbd>F</kbd><span><b id="prompt-name"></b><span id="prompt-verb"> 살펴보기</span></span></div>
    <div class="panel" id="dialogue" role="button" tabindex="0" aria-live="polite" hidden>
      <div id="dlg-who"></div>
      <p id="dlg-text"></p>
      <div id="dlg-next">Space · 클릭 ▸</div>
    </div>
  </div>

  <div id="devstart" hidden>
    <div class="card panel" role="dialog" aria-labelledby="devstart-title">
      <span class="tag">개발자 모드</span>
      <h2 id="devstart-title">메갈리스</h2>
      <p>어디서부터 시작할지 고르세요. 숫자 키로도 고를 수 있습니다.</p>
      <button type="button" id="start-intro"><kbd>1</kbd><span>유적지, 처음부터<small>잠든 로빈이 깨어나는 장면과 대사</small></span></button>
      <button type="button" id="start-ruins"><kbd>2</kbd><span>유적지, 인트로 건너뛰기<small>스톤헨지 한가운데서 바로 조작</small></span></button>
      <button type="button" id="start-door"><kbd>3</kbd><span>유적지, 빛의 문 앞<small>기억의 조각 3개를 모두 찾은 상태</small></span></button>
      <button type="button" id="start-village"><kbd>4</kbd><span>마을<small>도착 지점, 주민들과 대화 가능</small><small class="wait" id="village-wait" hidden>마을을 불러오는 중…</small></span></button>
    </div>
  </div>

  <div id="curtain"><p id="curtain-text">메갈리스를 불러오는 중…</p></div>
</div>
